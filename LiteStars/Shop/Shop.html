<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#17211d">
    <title>Shop | LiteStars</title>

    <link rel="stylesheet" href="Shop.css">
    <script src="Shop.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-actions">
            <button class="exit-button" id="exit-news" type="button" aria-label="상점에서 나가기" title="나가기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"></path><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path></svg>
                <span>나가기</span>
            </button>
        </div>
    </header>

    <main id="top">
        <section class="masthead" aria-labelledby="page-title">
            <div class="masthead-foot">
                <span>OFFICIAL OFFER STORE</span>
                <span id="feed-count">상품 불러오는 중</span>
            </div>
        </section>

        <section class="news-section shop-section" aria-labelledby="offers-heading">
            <div id="category-filters" class="category-filters" role="group" aria-label="오퍼 카테고리"></div>
            <div id="offer-list" class="offer-list" aria-live="polite" aria-busy="true">
                <div class="loading-state"><span class="loading-mark">✳</span><span>오퍼를 불러오고 있어요</span></div>
            </div>
        </section>
    </main>

    <dialog class="offer-dialog" id="offer-detail" aria-labelledby="detail-title">
        <div class="dialog-topline">
            <span class="eyebrow">OFFER DETAILS</span>
            <button class="dialog-close" id="close-detail" type="button" aria-label="상세 닫기" title="닫기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div id="detail-content"></div>
    </dialog>
</body>
</html>
